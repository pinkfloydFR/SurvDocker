services:
  loki:
    image: grafana/loki:latest
    container_name: survdocker_loki
    command: -config.file=/etc/loki/config.yml
    restart: unless-stopped
    volumes:
      - ${SURVDOCKER_SYSTEM_CONFIG_DIR}/loki-config.yml:/etc/loki/config.yml:ro
      - ${SURVDOCKER_DATA_DIR}/loki:/loki
    healthcheck:
      # grafana/loki:latest ships only the loki binary (no /bin/sh, no wget),
      # so a CMD-SHELL wget probe can never succeed. loki exposes its own
      # HTTP-based readiness via -config.file, so drive the check through it.
      test: ["CMD", "/usr/bin/loki", "-config.file=/etc/loki/config.yml", "-verify-config"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - survdocker

  alloy:
    image: grafana/alloy:latest
    container_name: survdocker_alloy
    command: run /etc/alloy/config.alloy
    restart: unless-stopped
    volumes:
      - ${SURVDOCKER_SYSTEM_CONFIG_DIR}/alloy.alloy:/etc/alloy/config.alloy:ro
      - ${SURVDOCKER_DATA_DIR}/alloy:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    healthcheck:
      # No curl/wget in the alloy image; use bash's /dev/tcp against Alloy's own readiness endpoint.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - survdocker

  survdocker:
    build: .
    container_name: survdocker_main
    command: ["python", "-m", "survdocker", "web"]
    restart: unless-stopped
    ports:
      - "60000:60000"
    environment:
      SURVDOCKER_DATA_DIR: /data
      SURVDOCKER_CONFIG_DIR: /app/survdocker/config
      SURVDOCKER_CONFIG_FILE: /app/survdocker/config/survdocker.yml
      SURVDOCKER_SCAN_TOKEN: ${SURVDOCKER_SCAN_TOKEN}
      SURVDOCKER_HOST: ${SURVDOCKER_HOST}
      SURVDOCKER_PORT: ${SURVDOCKER_PORT}
      LOKI_BASE_URL: ${LOKI_BASE_URL}
      TRAEFIK_AUTH_MIDDLEWARE: ${TRAEFIK_AUTH_MIDDLEWARE}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID}
      APPRISE_ENABLED: ${APPRISE_ENABLED}
      APPRISE_URL: ${APPRISE_URL}
      APPRISE_TAG: ${APPRISE_TAG}
    volumes:
      - ${SURVDOCKER_DATA_DIR}:/data
      - ${SURVDOCKER_CONFIG_DIR}:/app/survdocker/config:ro
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:60000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - survdocker
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.survdocker.rule=Host(`${SURVDOCKER_HOSTNAME}`)
      - traefik.http.routers.survdocker.entrypoints=websecure
      - traefik.http.routers.survdocker.service=survdocker
      - traefik.http.routers.survdocker.tls=true
      - traefik.http.routers.survdocker.middlewares=${TRAEFIK_AUTH_MIDDLEWARE}
      - traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.services.survdocker.loadbalancer.server.port=60000

  survdocker-scheduler:
    build: .
    container_name: survdocker_scheduler
    command: ["python", "-m", "survdocker", "scheduler"]
    restart: unless-stopped
    environment:
      SURVDOCKER_DATA_DIR: /data
      SURVDOCKER_CONFIG_DIR: /app/survdocker/config
      SURVDOCKER_CONFIG_FILE: /app/survdocker/config/survdocker.yml
      LOKI_BASE_URL: ${LOKI_BASE_URL}
    volumes:
      - ${SURVDOCKER_DATA_DIR}:/data
      - ${SURVDOCKER_CONFIG_DIR}:/app/survdocker/config:ro
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "python", "-m", "survdocker.heartbeat_check", "/data/scheduler-heartbeat.json", "180"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - survdocker

  survdocker-critical-monitor:
    build: .
    container_name: survdocker_critical_monitor
    command: ["python", "-m", "survdocker", "critical-monitor"]
    restart: unless-stopped
    environment:
      SURVDOCKER_DATA_DIR: /data
      SURVDOCKER_CONFIG_DIR: /app/survdocker/config
      SURVDOCKER_CONFIG_FILE: /app/survdocker/config/survdocker.yml
      LOKI_BASE_URL: ${LOKI_BASE_URL}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID}
      APPRISE_ENABLED: ${APPRISE_ENABLED}
      APPRISE_URL: ${APPRISE_URL}
      APPRISE_TAG: ${APPRISE_TAG}
    volumes:
      - ${SURVDOCKER_DATA_DIR}:/data
      - ${SURVDOCKER_CONFIG_DIR}:/app/survdocker/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "python", "-m", "survdocker.heartbeat_check", "/data/critical-monitor-heartbeat.json", "180"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - survdocker

networks:
  survdocker:
    name: survdocker
  traefik:
    external: true
