services:
  loki:
    image: grafana/loki:latest
    container_name: survdocker_loki
    command: -config.file=/etc/loki/config.yml
  main:
    build: .
    container_name: survdocker_main
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./survdocker/config/survdocker.yml:/app/survdocker/config/survdocker.yml:ro
      - ./survdocker/data:/app/survdocker/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=Europe/Paris
    depends_on:
      - loki
      - alloy
    networks:
      - survdocker

  loki:
    image: grafana/loki:latest
    container_name: survdocker_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - loki-data:/loki
    networks:
      - survdocker

  alloy:
    image: grafana/alloy:latest
    container_name: survdocker_alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    volumes:
      - ./survdocker/data/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - ALLOY_DEVEL_LOOKBACK_BUFFER_DURATION=24h
    depends_on:
      - loki
    networks:
      - survdocker

  volumes:
    loki-data:
      driver: local

  networks:
    survdocker:
      driver: bridge
