# SurvDocker user configuration (minimal)
#
# This file contains only business-level knobs.
# Docker/runtime infrastructure values (host, ports, Loki URL, Traefik chain,
# Telegram endpoint, etc.) are taken from .env and docker-compose.yml.

scan:
  # 1 = Monday, 7 = Sunday.
  day: 1
  # Daily scan time in HH:MM.
  time: 06:00
  # Look-back window used for the weekly report.
  lookback: 7d
  # Limits memory usage when a container is very noisy.
  max_log_lines_per_container: 50000
  # Max exact examples stored in each grouped error.
  max_examples_per_error: 100
  # Max top-level error groups kept per container.
  max_error_groups_per_container: 5
  # How many weekly reports to keep on disk.
  retention_reports: 4

filters:
  # Can disable the default ignore rules one by one by setting this to false.
  enable_default_ignore: true
  # Can disable the default keep rules one by one by setting this to false.
  enable_default_keep: true
  # Can disable the default warning rules one by one by setting this to false.
  enable_default_warning: true
  # Normal traffic that must not appear as incidents.
  ignore_patterns:
    - 'status_code=(200|204|301|302|401)'
    - 'robots\.txt'
    - 'healthcheck'
    - 'readiness'
    - 'liveness'
    - '/api/health'
    - '/ping'
    - 'Access to .* is not authorized'
    - 'unauthorized'
    - 'ip .* is banned'
    - 'GeoBlock: .* API timeout'
    # Alloy replaying a long-lived container's full Docker log history on
    # first discovery (or after losing its position file) and Loki correctly
    # rejecting entries older than reject_old_samples_max_age. Harmless -
    # those entries are outside the report's lookback window anyway - but
    # without this it shows up as a recurring false "incident" on the
    # survdocker_alloy/survdocker_loki containers themselves.
    - 'entry too far behind'
    - 'has timestamp too old'
    - 'entry for stream .* has timestamp too old'
    # Benign race: Alloy tries to read logs for a container that was already
    # removed between discovery and tailing.
    - 'could not fetch logs for container.*dead or marked for removal'
    # fail2ban telling you an IP it just tried to (re-)ban was already
    # banned - expected under a repeated intrusion attempt, not an incident.
    - 'already banned'
    # Container entrypoint housekeeping on restart, not an application error.
    - '\[container-init\] Detected Container that has been restarted'
    # gunicorn recycling a worker after --max-requests (apprise), normal operation.
    - 'Autorestarting worker after current request'
    # OpenVPN's periodic keepalive-triggered reconnect (gluetun) - distinct
    # from an actual AUTH_FAILED, which stays visible.
    - 'SIGUSR1\[soft,ping-restart\]'
    # OpenVPN/gluetun route table cleanup at (re)connect time - routinely
    # logged as an "error" even though the tunnel comes up fine afterwards.
    - 'RTNETLINK answers: Operation not permitted'
    - 'Linux route delete command failed'
    - 'Linux ip addr del failed'
    # youtubedl failing on a given video (unavailable, geo-blocked, etc.) is
    # routine and not a SurvDocker-worthy incident.
    - 'Failed to download'
    # AgentDVR keyword false positives: these are routine startup/state-dump
    # logging (a config value read at boot, and the periodic source
    # running/cooldown state cycle), not actual errors - they only get
    # classified as such because "timeout" / "error=True" / "SourceError"
    # appear as field names or values inside the dump, not as a real fault.
    - 'SetManualOptions:.*set timeout='
    - 'SetState:.*error=(True|False)'
    - 'SourcePlayingFinished:.*\(SourceError\)'
    # Expected self-signed internal CA, not a certificate problem.
    - 'CA certificate ca\.pem is self signed'
    # Werkzeug's dev-server banner (flagged as a warning-level line by our
    # own classifier, and by any container running a Python dev server),
    # not an actionable configuration issue.
    - 'This is a development server\. Do not use it in a production deployment'
    # Grafana: expired/rotated browser session (user just gets re-prompted),
    # 304 responses to cached assets, and bundled plugins that are also
    # installed - all routine, not faults.
    - 'Failed to authenticate request.*(user token not found|token needs to be rotated)'
    - 'Failed to write gzipped response.*does not allow body'
    - 'Skipping loading of plugin as it''s a duplicate'
    # Prometheus acknowledging a normal stop/restart.
    - 'Received an OS signal, exiting gracefully'
    # crowdsec-blocklist-import: summary of feed lines that are not IPs
    # (URLhaus hostnames, DShield table headers...) - skipped by design.
    - '\[WARNING\] \d+ parsing errors'
    # Startup/config chatter that repeats on every restart and needs no action.
    - 'pruner-loop: scheduling pruning every'
    - 'io_uring_queue_init\(\) failed with EPERM'
    - 'create_uring failed: falling back to libaio'
    - 'Supervisord is running as root|self\.warnings\.warn\('
    - 'ExperimentalWarning: WASI is an experimental feature|node --trace-warnings'
    - 'Failed to initialize DRI3 extension|mieq: warning: overriding existing handler'
    - '\.conf already exists and will be overriden'
    - 'no usable system locales were found'
    - 'initdb: warning: enabling "trust" authentication'
    - 'Worker \(pid:\d+\) was sent SIGINT'
    - "exists! \\(not copying the YOURLS version"
    # docker buildx builder container warnings emitted on each build.
    - 'only the default worker can be used|failed check for fsverity support|skipping containerd worker|using host network as the default'
    # Fragments of multi-line object dumps whose only "error"/"warning" is a
    # field name (prowlarr JSON, portabase pg client dump) - the actual
    # exception line of the same dump stays visible.
    - '"isWarning": false'
    - '"errorMessage": "Query successful, but no results'
    - '_connectionError: false'
    - '_events: \[Object: null prototype\] \{ error: \[Function'
    # Continuation lines of multi-line output (stack frames, pretty-printed
    # error structs, JSON bodies, gluetun's settings tree). Each one would
    # otherwise become its own group and push the head line of the same error
    # (non-indented: `OSError: ...`, `ModuleNotFoundError: ...`) out of the
    # per-container group limit.
    - '^\s+\S'
    - '^[|│├└]'
    # Vaultwarden failing to fetch a website favicon, and the `[CAUSE]` head
    # of the reqwest error dump that follows each of those lines.
    - 'Unable to download icon'
    - '^\[CAUSE\] reqwest::Error \{\s*$'
    # dnsmasq query log (log-queries): one line per DNS lookup, where domain
    # names like error-report.com or an upstream SERVFAIL reply look like errors.
    - 'dnsmasq\[\d+\]: (query\[\w+\]|forwarded|reply|cached|config) '
    # nginx spilling a large request/response body to disk - normal behaviour.
    - 'is buffered to a temporary file'
    # supervisord (Euro-Office) startup notice and normal stop sequence.
    - "CRIT Server 'unix_http_server' running without any HTTP authentication checking"
    - 'WARN received SIGTERM indicating exit request'
    - 'WARN stopped: .* \(terminated by SIGTERM\)'
    # MariaDB entrypoint probing cgroup files it cannot write in a container.
    - '\[Entrypoint\]: .* not writable, functionality unavailable to MariaDB'
    # *arr: public-tracker RSS feeds shorter than the sync interval, and
    # Prowlarr skipping an indexer with no results in the configured categories.
    - "rss sync didn't cover the period between"
    - 'No Results in configured categories'
    # termix UI session bookkeeping.
    - 'No WebSocket available for host key verification prompt'
    - 'Tab instance has live session, skipping duplicate create'
    # CrowdSec noticing a machine (blocklist importer) came back with a new
    # container IP after being recreated.
    - "new IP address detected for machine '.*'"
    # Alloy losing its Docker log stream while the Docker daemon restarts, or
    # inspecting a container that was just removed (same race as above).
    - 'could not transfer logs.*(use of closed network connection|read on closed response body)'
    - 'could not inspect container info.*No such container'
  # Signals that should generally be preserved as incidents.
  keep_patterns:
    - 'error'
    - '\bfatal\b'
    - 'panic'
    - 'exception'
    - 'failed'
    - 'failure'
    - '\btimeout\b'
    - 'connection refused'
    - 'permission denied'
    - 'database locked'
    - 'out of memory'
    - 'crashed'
    - 'restart'
  # Configuration and migration warnings shown separately in the report.
  warning_patterns:
    - 'deprecated'
    - 'warning'
    - 'invalid configuration'
    - 'unknown field'

critical:
  # Containers that must be ignored by the critical monitor.
  ignored_containers:
    - ancien_conteneur
    - test_temporaire
  # Containers considered critical for immediate alerting.
  critical_containers:
    - traefik
    - authelia_df
    - authelia_pf
    - redis_df
    - redis_pf
    - postgres
    - mariadb
    - rust_hbbs
    - rust_hbbr
  # Thresholds and cooldown values for Telegram alerting.
  critical_alerts:
    enabled: true
    error_threshold: 3
    error_window_seconds: 300
    restart_threshold: 3
    restart_window_seconds: 600
    notification_cooldown_seconds: 3600
    notify_resolution: false
  # Known service dependencies used to explain likely root causes.
  dependencies:
    authelia_pf:
      - authelia_redis_pf
    authelia_df:
      - authelia_redis_df
    bookstack:
      - mariadb

# Loki storage retention (applied by Loki's compactor). Also bounds the "all"
# range of the container log viewer.
loki:
  retention_days: 15
