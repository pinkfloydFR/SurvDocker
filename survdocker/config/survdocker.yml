# SurvDocker user configuration (minimal)
#
# This file contains only business-level knobs.
# Docker/runtime infrastructure values (host, ports, Loki URL, Traefik chain,
# Telegram endpoint, etc.) are taken from .env and docker-compose.yml.

scan:
  # 1 = Monday, 7 = Sunday.
  day: 1
  # Daily scan time in HH:MM.
  time: 06:00
  # Look-back window used for the weekly report.
  lookback: 7d
  # Limits memory usage when a container is very noisy.
  max_log_lines_per_container: 50000
  # Max exact examples stored in each grouped error.
  max_examples_per_error: 100
  # Max top-level error groups kept per container.
  max_error_groups_per_container: 5
  # How many weekly reports to keep on disk.
  retention_reports: 4

filters:
  # Can disable the default ignore rules one by one by setting this to false.
  enable_default_ignore: true
  # Can disable the default keep rules one by one by setting this to false.
  enable_default_keep: true
  # Can disable the default warning rules one by one by setting this to false.
  enable_default_warning: true
  # Normal traffic that must not appear as incidents.
  ignore_patterns:
    - 'status_code=(200|204|301|302|401)'
    - 'robots\.txt'
    - 'healthcheck'
    - 'readiness'
    - 'liveness'
    - '/api/health'
    - '/ping'
    - 'Access to .* is not authorized'
    - 'unauthorized'
    - 'ip .* is banned'
    - 'GeoBlock: .* API timeout'
    # Alloy replaying a long-lived container's full Docker log history on
    # first discovery (or after losing its position file) and Loki correctly
    # rejecting entries older than reject_old_samples_max_age. Harmless -
    # those entries are outside the report's lookback window anyway - but
    # without this it shows up as a recurring false "incident" on the
    # survdocker_alloy/survdocker_loki containers themselves.
    - 'entry too far behind'
    - 'has timestamp too old'
    - 'entry for stream .* has timestamp too old'
    # Benign race: Alloy tries to read logs for a container that was already
    # removed between discovery and tailing.
    - 'could not fetch logs for container.*dead or marked for removal'
    # fail2ban telling you an IP it just tried to (re-)ban was already
    # banned - expected under a repeated intrusion attempt, not an incident.
    - 'already banned'
    # Container entrypoint housekeeping on restart, not an application error.
    - '\[container-init\] Detected Container that has been restarted'
    # gunicorn recycling a worker after --max-requests (apprise), normal operation.
    - 'Autorestarting worker after current request'
    # OpenVPN's periodic keepalive-triggered reconnect (gluetun) - distinct
    # from an actual AUTH_FAILED, which stays visible.
    - 'SIGUSR1\[soft,ping-restart\]'
    # OpenVPN/gluetun route table cleanup at (re)connect time - routinely
    # logged as an "error" even though the tunnel comes up fine afterwards.
    - 'RTNETLINK answers: Operation not permitted'
    - 'Linux route delete command failed'
    - 'Linux ip addr del failed'
  # Signals that should generally be preserved as incidents.
  keep_patterns:
    - 'error'
    - '\bfatal\b'
    - 'panic'
    - 'exception'
    - 'failed'
    - 'failure'
    - '\btimeout\b'
    - 'connection refused'
    - 'permission denied'
    - 'database locked'
    - 'out of memory'
    - 'crashed'
    - 'restart'
  # Configuration and migration warnings shown separately in the report.
  warning_patterns:
    - 'deprecated'
    - 'warning'
    - 'invalid configuration'
    - 'unknown field'

critical:
  # Containers that must be ignored by the critical monitor.
  ignored_containers:
    - ancien_conteneur
    - test_temporaire
  # Containers considered critical for immediate alerting.
  critical_containers:
    - traefik
    - authelia_df
    - authelia_pf
    - redis_df
    - redis_pf
    - postgres
    - mariadb
  # Thresholds and cooldown values for Telegram alerting.
  critical_alerts:
    enabled: true
    error_threshold: 3
    error_window_seconds: 300
    restart_threshold: 3
    restart_window_seconds: 600
    notification_cooldown_seconds: 3600
    notify_resolution: false
  # Known service dependencies used to explain likely root causes.
  dependencies:
    authelia_pf:
      - authelia_redis_pf
    authelia_df:
      - authelia_redis_df
    bookstack:
      - mariadb
