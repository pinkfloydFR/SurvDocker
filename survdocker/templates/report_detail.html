<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ report_name }}</title>
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f3f4ef; color: #142033; }
    main { max-width: 1200px; margin: 0 auto; padding: 32px 18px; }
    pre { background: #0f172a; color: #f8fafc; padding: 18px; border-radius: 16px; overflow-x: auto; }
  </style>
</head>
<body>
  <main>
    <h1>{{ report_name }}</h1>
    <p>Génération: {{ summary.generated_at }} · Conteneurs: {{ summary.container_count }}</p>
    <pre>{{ report | tojson(indent=2) }}</pre>
  </main>
</body>
</html>
