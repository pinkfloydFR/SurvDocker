<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ report_name }}</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #0b0f17; color: #e6e9ef; }
    main { width: 100%; margin: 0 auto; padding: 32px 32px; box-sizing: border-box; }
    pre { background: #0f172a; color: #f8fafc; padding: 18px; border-radius: 16px; overflow-x: auto; }
  </style>
</head>
<body>
  <main>
    <h1>{{ report_name }}</h1>
    <p>Génération: {{ summary.generated_at }} · Conteneurs: {{ summary.container_count }}</p>
    <pre>{{ report | tojson(indent=2) }}</pre>
  </main>
</body>
</html>
